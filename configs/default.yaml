project:
  name: vig_grounded_hallucination_pilot
  seed: 42

paths:
  pope_dir: data/raw/pope
  coco_image_dir: data/raw/coco/val2014
  split_dir: data/splits
  output_dir: outputs

data:
  settings:
    - random
    - popular
    - adversarial
  split_unit: image
  dev_ratio: 0.2

mllm:
  model_id: Qwen/Qwen2.5-VL-3B-Instruct
  batch_size: 1
  do_sample: false
  max_new_tokens: 4

grounder:
  model_id: google/owlv2-base-patch16-ensemble
  query_template: "a photo of a {object_phrase}"
  postprocess_threshold: 0.001

gate:
  selection_split: dev
  objective: balanced_accuracy
  threshold_min: 0.0
  threshold_max: 0.5
  threshold_step: 0.01

evaluation:
  metrics:
    - accuracy
    - precision
    - recall
    - f1
    - false_positive_rate
    - yes_ratio
    - auroc
    - auprc
  bootstrap_samples: 1000
  confidence_level: 0.95
